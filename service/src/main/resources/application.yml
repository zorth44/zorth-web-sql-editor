spring:
  application:
    name: zorth-web-sql-service
  datasource:
    url: ${SQL_EDITOR_METADATA_URL:jdbc:mysql://127.0.0.1:3306/sqleditor}
    username: ${SQL_EDITOR_METADATA_USERNAME:sqleditor_user}
    password: ${SQL_EDITOR_METADATA_PASSWORD:sqleditor_password}
    hikari:
      maximum-pool-size: ${SQL_EDITOR_METADATA_POOL_SIZE:10}
      connection-init-sql: SET time_zone = '+00:00'
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false
  flyway:
    enabled: true
    encoding: UTF-8
  mvc:
    throw-exception-if-no-handler-found: true

mybatis:
  mapper-locations: classpath:/mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true

sql-editor:
  auth:
    context-url: ${SQL_EDITOR_AUTH_CONTEXT_URL:http://127.0.0.1:8090/internal/api/v1/auth/context}
    internal-service-key: ${SQL_EDITOR_AUTH_INTERNAL_SERVICE_KEY:local-sql-editor-key}
    connect-timeout-ms: ${SQL_EDITOR_AUTH_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${SQL_EDITOR_AUTH_READ_TIMEOUT_MS:3000}
    cache-ttl-seconds: ${SQL_EDITOR_AUTH_CACHE_TTL_SECONDS:60}
    cache-maximum-size: ${SQL_EDITOR_AUTH_CACHE_MAXIMUM_SIZE:10000}
  credentials:
    current-version: ${SQL_EDITOR_CREDENTIAL_CURRENT_VERSION:v1}
    keys:
      v1: ${SQL_EDITOR_CREDENTIAL_CURRENT_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  cursor:
    signing-key: ${SQL_EDITOR_CURSOR_SIGNING_KEY:YWJjZGVmMDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODk=}
    maximum-token-length: ${SQL_EDITOR_CURSOR_MAXIMUM_TOKEN_LENGTH:2048}
  network:
    allowed-cidrs: ${SQL_EDITOR_NETWORK_ALLOWED_CIDRS:127.0.0.0/8,10.118.247.8/32}
    denied-cidrs: ${SQL_EDITOR_NETWORK_DENIED_CIDRS:169.254.0.0/16,::1/128,fe80::/10}
  pools:
    max-pools: ${SQL_EDITOR_TARGET_MAX_POOLS:10}
    max-connections: ${SQL_EDITOR_TARGET_MAX_CONNECTIONS:50}
    max-pool-size: ${SQL_EDITOR_TARGET_POOL_SIZE:5}
    idle-pool-minutes: ${SQL_EDITOR_TARGET_IDLE_POOL_MINUTES:30}
  execution:
    default-row-limit: ${SQL_EDITOR_DEFAULT_ROW_LIMIT:1000}
    max-row-limit: ${SQL_EDITOR_MAX_ROW_LIMIT:100000}
    max-result-bytes: ${SQL_EDITOR_MAX_RESULT_BYTES:104857600}
    timeout-seconds: ${SQL_EDITOR_EXECUTION_TIMEOUT_SECONDS:60}
    max-concurrent-per-user: ${SQL_EDITOR_MAX_CONCURRENT_PER_USER:3}
    max-concurrent-global: ${SQL_EDITOR_MAX_CONCURRENT_GLOBAL:50}
    max-statement-bytes: ${SQL_EDITOR_MAX_STATEMENT_BYTES:1048576}
    executor-pool-size: ${SQL_EDITOR_EXECUTOR_POOL_SIZE:50}
  export:
    formula-protection: ${SQL_EDITOR_CSV_FORMULA_PROTECTION:true}
    null-literal: ${SQL_EDITOR_CSV_NULL_LITERAL:false}
  history:
    retention-days: ${SQL_EDITOR_HISTORY_RETENTION_DAYS:90}
    stale-running-minutes: ${SQL_EDITOR_STALE_RUNNING_MINUTES:5}
  http:
    trusted-proxy-cidrs: []

management:
  server:
    port: ${SQL_EDITOR_MANAGEMENT_PORT:9081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
    env:
      enabled: false
    configprops:
      enabled: false
    heapdump:
      enabled: false
  health:
    group:
      liveness:
        include: livenessState,ping
      readiness:
        include: readinessState,db,authOrigin

springdoc:
  show-actuator: false
